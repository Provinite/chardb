# Production-specific overrides
services:
  backend:
    # Use pre-built ECR image instead of building locally
    image: ${ECR_REPOSITORY_URL}:${IMAGE_TAG:-latest}
    # Bound the blast radius of a runaway process on the 910 MB host. The host
    # has no swap, so this is a hard ceiling -- `prisma migrate deploy` runs
    # under it at container start.
    mem_limit: 512m
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      # Pinned, not read from .env: this host runs no collector, so an enabled
      # exporter would retry forever and queue spans in the heap against the
      # mem_limit above. A dropped .env line must not be able to re-enable it.
      OTEL_SDK_DISABLED: "true"
  postgres:
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # No `ports` override here: compose appends to the base list rather than
    # replacing it, which would publish postgres twice. The loopback binding
    # lives in services/postgres.yml; POSTGRES_PORT selects the host port.
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: chardb-prod-network
