# Operations used by the seeding layer.
#
# Argument names are inconsistent across this API -- some mutations take
# `input:`, others a verbose `createSpeciesInput:`. Codegen validates every one
# of these against apps/backend/src/schema.gql, so a mismatch fails at codegen
# time rather than at seed time.

mutation SeedLogin($input: LoginInput!) {
  login(input: $input) {
    accessToken
    refreshToken
  }
}

# Requires the GLOBAL canCreateCommunity flag. Transactionally auto-creates the
# Admin / Moderator / Member roles and binds the creator to Admin.
mutation SeedCreateCommunity($createCommunityInput: CreateCommunityInput!) {
  createCommunity(createCommunityInput: $createCommunityInput) {
    id
    name
  }
}

query SeedRolesByCommunity($communityId: ID!) {
  rolesByCommunity(communityId: $communityId) {
    nodes {
      id
      name
      canDeleteCharacter
      canEditCharacterRegistry
    }
  }
}

mutation SeedCreateRole($createRoleInput: CreateRoleInput!) {
  createRole(createRoleInput: $createRoleInput) {
    id
    name
    canDeleteCharacter
    canEditCharacterRegistry
  }
}

# Requires GLOBAL isAdmin -- not a community permission.
mutation SeedCreateCommunityMember(
  $createCommunityMemberInput: CreateCommunityMemberInput!
) {
  createCommunityMember(
    createCommunityMemberInput: $createCommunityMemberInput
  ) {
    id
  }
}

# Requires community CanCreateSpecies. Notably has NO global-admin bypass.
mutation SeedCreateSpecies($createSpeciesInput: CreateSpeciesInput!) {
  createSpecies(createSpeciesInput: $createSpeciesInput) {
    id
    name
  }
}

mutation SeedCreateSpeciesVariant(
  $createSpeciesVariantInput: CreateSpeciesVariantInput!
) {
  createSpeciesVariant(createSpeciesVariantInput: $createSpeciesVariantInput) {
    id
    name
  }
}

mutation SeedCreateTrait($createTraitInput: CreateTraitInput!) {
  createTrait(createTraitInput: $createTraitInput) {
    id
    name
    valueType
  }
}

mutation SeedCreateEnumValue($createEnumValueInput: CreateEnumValueInput!) {
  createEnumValue(createEnumValueInput: $createEnumValueInput) {
    id
    name
  }
}

# `speciesId` is nullable in the schema but the resolver rejects its absence.
# Passing non-empty `traitValues` auto-creates a PENDING TraitReview with source
# CREATION -- that is how the review-queue fixture is seeded.
mutation SeedCreateCharacter($input: CreateCharacterInput!) {
  createCharacter(input: $input) {
    id
    name
  }
}

# Flipping isTradeable mid-test, which is the whole point of the settlement
# re-check: nothing is escrowed, so an owner can close a character to trades
# while an offer for it is standing. Requires canEditOwnCharacter, which the
# stock Member role carries.
mutation SeedUpdateCharacterProfile(
  $id: ID!
  $input: UpdateCharacterProfileInput!
) {
  updateCharacterProfile(id: $id, input: $input) {
    id
    isTradeable
  }
}

query SeedTraitReviewQueue($communityId: ID!, $first: Int, $offset: Int) {
  traitReviewQueue(communityId: $communityId, first: $first, offset: $offset) {
    total
    items {
      review {
        id
        status
        characterId
        deferredAt
        deferralCount
        deferralNote
      }
    }
  }
}

# Sending an entry to the back, so a spec can prove the queue reorders and the
# review stays pending while it does.
mutation SeedDeferTraitReview($input: DeferTraitReviewInput!) {
  deferTraitReview(input: $input) {
    id
    status
    deferralCount
    deferralNote
  }
}

query SeedCharacterCount {
  characters {
    total
  }
}

# Verification operations. These let specs assert through the API rather than
# reaching into the database behind the system under test.

query SeedCharacter($id: ID!) {
  character(id: $id) {
    id
    name
    registryId
    speciesId
    speciesVariantId
    customFields
    traitReviewStatus
    owner {
      id
    }
    species {
      id
      name
    }
    traitValues {
      traitId
      value
    }
    pendingTraitReviewSource
  }
}

# --- Items and the item ledger -----------------------------------------------

# Requires community CanManageItems.
mutation SeedCreateItemType($input: CreateItemTypeInput!) {
  createItemType(input: $input) {
    id
    name
  }
}

# Requires community CanGrantItems. Returns one Item PER UNIT -- there is no
# stacking, so quantity: 3 comes back as three items. `reason` and `staffNote`
# land on the ledger rows this produces; staffNote is only ever returned to a
# viewer holding item permissions in the same community.
mutation SeedGrantItem($input: GrantItemInput!) {
  grantItem(input: $input) {
    id
    ownerId
    destroyedAt
  }
}

mutation SeedUpdateItem($id: ID!, $input: UpdateItemInput!) {
  updateItem(id: $id, input: $input) {
    id
    metadata
  }
}

# `reason` is required: it is public, and it is what a member sees on the
# provenance of an item that was taken away from them. Soft -- the items stay
# readable, marked destroyed. Returns the count revoked.
mutation SeedRevokeItems(
  $itemIds: [ID!]!
  $reason: String!
  $staffNote: String
) {
  revokeItems(itemIds: $itemIds, reason: $reason, staffNote: $staffNote)
}

# Readable by any member of the community, staff or not.
query SeedItemTransactions($filters: ItemTransactionFiltersInput!) {
  itemTransactions(filters: $filters) {
    total
    hasMore
    transactions {
      id
      kind
      batchId
      batchSize
      reason
      staffNote
      actorLabel
      itemId
      itemType {
        id
        name
      }
      fromUser {
        id
        username
      }
      toUser {
        id
        username
      }
      actorUser {
        id
        username
      }
    }
  }
}

query SeedItemProvenance($itemId: ID!) {
  itemProvenance(itemId: $itemId) {
    id
    kind
    batchId
    reason
    staffNote
  }
}

# Verification: what item types exist, so a spec can assert a create was
# refused rather than matching on error copy.
query SeedItemTypes($filters: ItemTypeFiltersInput) {
  itemTypes(filters: $filters) {
    total
    itemTypes {
      id
      name
      category
      isTradeable
      isConsumable
    }
  }
}

# Both gated on CanManageItems. Present so the permission matrix can attempt
# every mutation, not just the ones a happy-path spec happened to need.
mutation SeedUpdateItemType($id: ID!, $input: UpdateItemTypeInput!) {
  updateItemType(id: $id, input: $input) {
    id
    name
  }
}

mutation SeedDeleteItemType($id: ID!) {
  deleteItemType(id: $id)
}

# One item, including a destroyed one. Membership-gated like itemProvenance.
query SeedItem($id: ID!) {
  item(id: $id) {
    id
    itemTypeId
    ownerId
    destroyedAt
  }
}

# A trait's place in one variant's list. `order` here is the order characters
# display their traits in, which is the whole point of the entry existing.
# Requires community CanEditSpecies.
mutation SeedCreateTraitListEntry($input: CreateTraitListEntryInput!) {
  createTraitListEntry(createTraitListEntryInput: $input) {
    id
    order
  }
}

# Reordering the variant's trait list -- what staff do in the species panel,
# and what every existing character's display is supposed to follow.
mutation SeedUpdateTraitOrders($input: UpdateTraitOrdersInput!) {
  updateTraitOrders(input: $input) {
    id
    order
  }
}

# ==================== Currency ====================

# Requires community CanManageItems -- currency reuses the item permissions
# rather than defining its own.
# Configuring what using an item pays. Requires community CanManageItems --
# it is minting rights, so it sits with editing the item type rather than with
# granting.
mutation SeedSetItemTypeUsePayout($input: SetItemTypeUsePayoutInput!) {
  setItemTypeUsePayout(input: $input) {
    id
    usePayout {
      amount
      currency {
        id
        code
      }
    }
  }
}

# Using an item, for the specs that assert through the API rather than the UI.
mutation SeedUseItem($input: UseItemInput!) {
  useItem(input: $input) {
    itemTypeName
    batchId
    payout {
      amount
      currency {
        id
        code
      }
    }
  }
}

mutation SeedSetItemTypeMyoGrant($input: SetItemTypeMyoGrantInput!) {
  setItemTypeMyoGrant(input: $input) {
    id
    useMyoGrant {
      id
      species {
        id
        name
      }
      variants {
        id
        name
      }
    }
  }
}

mutation SeedSetItemTypeTraitEditGrant(
  $input: SetItemTypeTraitEditGrantInput!
) {
  setItemTypeTraitEditGrant(input: $input) {
    id
    useTraitEditGrant {
      id
      species {
        id
        species {
          id
          name
        }
        variants {
          id
          name
        }
      }
    }
  }
}

mutation SeedEditCharacterTraitsWithKit(
  $input: EditCharacterTraitsWithKitInput!
) {
  editCharacterTraitsWithKit(input: $input) {
    id
    status
    source
    characterId
  }
}

mutation SeedSetItemTypeVariantChangeGrant(
  $input: SetItemTypeVariantChangeGrantInput!
) {
  setItemTypeVariantChangeGrant(input: $input) {
    id
    useVariantChangeGrant {
      id
      species {
        id
        name
      }
      toVariant {
        id
        name
      }
      fromVariants {
        id
        name
      }
    }
  }
}

mutation SeedChangeCharacterVariantWithItem(
  $input: ChangeCharacterVariantWithItemInput!
) {
  changeCharacterVariantWithItem(input: $input) {
    id
    speciesVariantId
    traitReviewStatus
  }
}

mutation SeedUpdateCharacterRegistry(
  $id: ID!
  $input: UpdateCharacterRegistryInput!
) {
  updateCharacterRegistry(id: $id, input: $input) {
    id
    speciesVariantId
  }
}

mutation SeedCreateCharacterFromMyoTicket($input: RedeemMyoTicketInput!) {
  createCharacterFromMyoTicket(input: $input) {
    id
    name
    registryId
    speciesId
    speciesVariantId
    traitReviewStatus
  }
}

mutation SeedCreateEnumValueSetting(
  $createEnumValueSettingInput: CreateEnumValueSettingInput!
) {
  createEnumValueSetting(
    createEnumValueSettingInput: $createEnumValueSettingInput
  ) {
    id
  }
}

query SeedCharacterVariantChanges($characterId: ID!) {
  characterVariantChanges(characterId: $characterId) {
    id
    reason
    fromVariant {
      id
      name
    }
    toVariant {
      id
      name
    }
    changedBy {
      username
    }
    previousTraitValues {
      traitId
      value
    }
    newTraitValues {
      traitId
      value
    }
  }
}

mutation SeedDeleteCharacter($id: ID!) {
  deleteCharacter(id: $id)
}

mutation SeedKickCharacterFromSpecies($id: ID!) {
  kickCharacterFromSpecies(id: $id)
}

# Editing a role, so a spec can take a permission away and prove what still
# works without it. Requires community CanEditRole.
mutation SeedUpdateRole($id: ID!, $updateRoleInput: UpdateRoleInput!) {
  updateRole(id: $id, updateRoleInput: $updateRoleInput) {
    id
    canCreateCharacter
  }
}

# Resolving a review, so a spec can prove what a rejection does to the ticket.
mutation SeedApproveTraitReview($input: ApproveTraitReviewInput!) {
  approveTraitReview(input: $input) {
    id
    status
  }
}

mutation SeedRevertTraitReview($input: RevertTraitReviewInput!) {
  revertTraitReview(input: $input) {
    id
    status
  }
}

mutation SeedCreateCurrency($input: CreateCurrencyInput!) {
  createCurrency(input: $input) {
    id
    name
    code
    symbol
  }
}

mutation SeedUpdateCurrency($id: ID!, $input: UpdateCurrencyInput!) {
  updateCurrency(id: $id, input: $input) {
    id
    archivedAt
    isTradeable
  }
}

# Requires community CanGrantItems. Returns the batch id every row it wrote
# shares -- one row per recipient, so paying eleven people is one event.
mutation SeedMintCurrency($input: MintCurrencyInput!) {
  mintCurrency(input: $input)
}

mutation SeedBurnCurrency($input: BurnCurrencyInput!) {
  burnCurrency(input: $input)
}

# Needs only community membership. The balance is the authorisation.
mutation SeedTransferCurrency($input: TransferCurrencyInput!) {
  transferCurrency(input: $input)
}

query SeedMemberWallet($communityId: ID!, $userId: ID!) {
  memberWallet(communityId: $communityId, userId: $userId) {
    userId
    balances {
      amount
      currency {
        id
        code
        name
      }
    }
  }
}

query SeedCurrencySupply($communityId: ID!) {
  currencySupply(communityId: $communityId) {
    currency {
      id
      code
    }
    inCirculation
    holders
    mintedLast30Days
    removedLast30Days
    largestBalance
  }
}

query SeedCurrencyTransactions($filters: CurrencyTransactionFiltersInput!) {
  currencyTransactions(filters: $filters) {
    total
    hasMore
    transactions {
      id
      kind
      amount
      balanceAfter
      batchId
      reason
      staffNote
      userId
      counterpartyId
      source
      sourceId
      currency {
        code
      }
    }
  }
}

query SeedCurrencies($communityId: ID!, $includeArchived: Boolean) {
  currencies(communityId: $communityId, includeArchived: $includeArchived) {
    id
    name
    code
    archivedAt
  }
}

query SeedCurrencyHolders($currencyId: ID!) {
  currencyHolders(currencyId: $currencyId) {
    userId
    amount
    user {
      username
    }
  }
}

# ==================== Image moderation ====================

mutation SeedApproveImage($input: ApproveImageInput!) {
  approveImage(input: $input) {
    id
    action
    currencyAwards {
      userId
      amount
      source
      sourceId
      currency {
        code
      }
    }
  }
}

# `awardRecipients` is null -- not empty -- for a viewer without
# canGrantItems, which is what hides the award widget.
query SeedMediaModerationQueue($communityId: ID!) {
  mediaModerationQueue(communityId: $communityId, first: 20, offset: 0) {
    total
    media {
      id
      title
      # The queue orders by these across the media -> image relation, so
      # selecting them is also what proves that query runs at all.
      pendingModerationImage {
        id
        moderationStatus
        deferredAt
        deferralCount
        deferralNote
        deferredBy {
          username
        }
      }
      awardRecipients {
        userId
        relations
        isMember
        user {
          username
        }
      }
    }
  }
}

mutation SeedDeferImage($input: DeferImageInput!) {
  deferImage(input: $input) {
    id
    moderationStatus
    deferralCount
    deferralNote
  }
}

# ==================== Shop ====================

# Requires community CanManageItems.
#
# These select `purchasedByViewer` and `affordable` deliberately. They are
# non-nullable and computed per viewer, so a mutation that answers with a row
# straight from the write serialises them as null and fails *after*
# committing. Selecting them here is what makes that a test failure rather
# than something the storefront discovers.
mutation SeedCreateShopItem($input: CreateShopItemInput!) {
  createShopItem(input: $input) {
    id
    name
    stock
    maxPerUser
    active
    purchasedByViewer
    prices {
      id
      affordable
      components {
        amount
        currency {
          code
        }
      }
    }
  }
}

mutation SeedUpdateShopItem($id: ID!, $input: UpdateShopItemInput!) {
  updateShopItem(id: $id, input: $input) {
    id
    active
    stock
    purchasedByViewer
    prices {
      id
      affordable
      components {
        amount
        currency {
          code
        }
      }
    }
  }
}

# Needs only membership. The balance is the authorisation.
mutation SeedCheckout($input: CheckoutInput!) {
  checkout(input: $input) {
    id
    createdAt
    lines {
      id
      refundedAt
      refundableByViewer
      refundBlockedReason
      costs {
        amount
        currency {
          code
        }
      }
      shopItem {
        id
        name
        purchasedByViewer
        prices {
          id
          affordable
        }
      }
    }
  }
}

# Used to take a buyer out of the community and check that a refund which
# cannot pay them is refused rather than destroying their item for nothing.
query SeedCommunityMembers($communityId: ID!) {
  communityMembersByCommunity(communityId: $communityId, first: 50) {
    nodes {
      id
      userId
    }
  }
}

mutation SeedRemoveCommunityMember($id: ID!) {
  removeCommunityMember(id: $id) {
    id
  }
}

mutation SeedRefundShopLine($lineId: ID!) {
  refundShopPurchaseLine(lineId: $lineId) {
    id
    refundedAt
    refundableByViewer
    refundBlockedReason
    shopItem {
      id
      stock
      purchasedByViewer
      prices {
        id
        affordable
      }
    }
  }
}

query SeedShopItems($communityId: ID!, $includeInactive: Boolean) {
  shopItems(communityId: $communityId, includeInactive: $includeInactive) {
    id
    name
    stock
    maxPerUser
    active
    purchasedByViewer
    prices {
      id
      affordable
      components {
        amount
        currency {
          id
          code
        }
      }
    }
  }
}

query SeedCommunityShopPurchases($communityId: ID!, $buyerId: ID) {
  communityShopPurchases(communityId: $communityId, buyerId: $buyerId) {
    id
    buyerId
    buyer {
      username
    }
    lines {
      id
      refundedAt
      refundableByViewer
      refundBlockedReason
      refundedBy {
        username
      }
      shopItem {
        id
        name
      }
    }
  }
}

query SeedMyShopPurchases($communityId: ID!) {
  myShopPurchases(communityId: $communityId) {
    id
    createdAt
    lines {
      id
      refundedAt
      refundableByViewer
      refundBlockedReason
      costs {
        amount
        currency {
          code
        }
      }
      shopItem {
        id
        name
        purchasedByViewer
        prices {
          id
          affordable
        }
      }
    }
  }
}

# What one member holds, grouped by item type. Unpaginated by design.
query SeedMemberHoldings($communityId: ID!, $userId: ID!) {
  memberHoldings(communityId: $communityId, userId: $userId) {
    totalItems
    holdings {
      count
      itemType {
        id
        name
      }
    }
  }
}

# --- Owner-filtered listings (#321) ------------------------------------------

# Galleries are not part of any preset, so a spec that needs one makes it.
mutation SeedCreateGallery($input: CreateGalleryInput!) {
  createGallery(input: $input) {
    id
    name
    visibility
  }
}

# The two queries the per-owner pages read. Selected here so a spec can assert
# what the API hands a given viewer, independently of what the page renders.
query SeedUserCharacters($userId: ID!) {
  userCharacters(userId: $userId, filters: { limit: 50, offset: 0 }) {
    total
    characters {
      name
      visibility
    }
  }
}

query SeedUserGalleries($userId: ID!) {
  userGalleries(userId: $userId, filters: { limit: 50, offset: 0 }) {
    total
    galleries {
      name
      visibility
    }
  }
}
