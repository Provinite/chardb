name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A superseded pull request push is safe to cancel. A run on main is not: it
  # ends in a deploy, and cancelling mid-flight can leave the staging host with
  # images pulled and no containers running. Runs on main queue instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint & format (changed files)
    runs-on: ubuntu-latest
    # Deliberately scoped to changed files. The repo predates a working lint
    # setup, so a repo-wide gate would fail on hundreds of pre-existing
    # violations; this holds new and modified code to the full rule set instead.

    steps:
      # Full history: the changed-file set is a diff against the merge base,
      # which a shallow clone would not contain.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            .yarn/install-state.gz
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      # No build step: the lint preset is the non-type-checked one, so it needs
      # no declaration files from packages/*.
      - name: Resolve diff base
        id: base
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            # Pull request: diff against the target branch.
            # Explicit refspec so the remote-tracking ref definitely exists.
            git fetch --no-tags origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            # Push to main: diff against whatever the branch pointed at before.
            # `before` is all-zeroes for a branch's first push or after a force
            # push, in which case fall back to the previous commit.
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              before="$(git rev-parse HEAD~1)"
            fi
            echo "ref=$before" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint changed files
        run: yarn lint:changed --base "${{ steps.base.outputs.ref }}"

  verify:
    name: Type check & generated file drift
    runs-on: ubuntu-latest

    env:
      # prisma generate resolves env("DATABASE_URL") from the datasource block.
      # It never connects, so a placeholder is enough.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Corepack must be enabled before setup-node: `cache: yarn` shells out to
      # `yarn cache dir` inside that step, and the runner's default Yarn 1.22
      # refuses to run against a `packageManager: yarn@4` project.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      # `cache: yarn` above only caches Yarn's download cache; with the
      # node-modules linker the link step still costs ~45s. Caching the
      # resulting node_modules trees lets a lockfile-identical run skip
      # installing altogether.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            .yarn/install-state.gz
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      # apps/* consume these via their package "types" field, which points at
      # dist/. That is gitignored, so a fresh checkout has no type declarations
      # for them until they are built. @chardb/database's build also runs
      # prisma generate. The three have no dependencies on each other, so they
      # build in parallel.
      - name: Build workspace packages
        run: |
          yarn workspaces foreach -A --parallel \
            --include '@chardb/database' \
            --include '@chardb/shared' \
            --include '@chardb/ui' \
            run build

      # tsc reuses these to skip re-checking unchanged files. A restored file
      # from an older commit is safe: tsc validates it against current file
      # contents and rechecks anything stale, including files whose
      # dependencies changed.
      - name: Restore TypeScript build info
        uses: actions/cache@v6
        with:
          path: |
            apps/frontend/tsconfig.tsbuildinfo
            apps/backend/dist/tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-${{ runner.os }}-

      # Kept sequential deliberately: ubuntu-latest has 4 vCPUs, and running
      # all six workspace tsc processes at once contends rather than helps.
      - name: Type check
        run: yarn type-check

      # The frontend's generated GraphQL types are committed but only refresh
      # when someone runs codegen by hand. When they go stale, main can stop
      # compiling -- regenerate and fail if the result differs from what is
      # checked in.
      - name: Check GraphQL codegen is up to date
        run: |
          yarn workspace @chardb/frontend codegen
          if ! git diff --quiet -- apps/frontend/src/generated/graphql.ts; then
            echo "::error file=apps/frontend/src/generated/graphql.ts::Generated GraphQL types are out of date. Run 'yarn workspace @chardb/frontend codegen' and commit the result."
            git diff -- apps/frontend/src/generated/graphql.ts
            exit 1
          fi
          echo "Generated GraphQL types are up to date."

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    # Independent of `verify` on purpose: a type error and a broken user flow are
    # different signals, and running them in parallel keeps the slower job off
    # the critical path.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            .yarn/install-state.gz
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      # The browser download is ~130MB and unchanged between runs; key it on the
      # resolved Playwright version so a bump busts the cache automatically.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(yarn workspace @chardb/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            # Browser binary is cached; still need the shared libraries it links against.
            yarn workspace @chardb/e2e exec playwright install-deps chromium
          else
            yarn workspace @chardb/e2e exec playwright install --with-deps chromium
          fi

      # @chardb/database's build runs prisma generate; apps/* consume these
      # packages through their `types` field, which points at gitignored dist/.
      - name: Build workspace packages
        run: |
          yarn workspaces foreach -A --parallel \
            --include '@chardb/database' \
            --include '@chardb/shared' \
            --include '@chardb/ui' \
            run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # No `services:` block: the suite starts its own Postgres through
      # docker/compose.test.yml, exactly as it does locally. Keeping the two
      # identical means a CI failure reproduces with a plain `yarn e2e`.
      - name: Run browser E2E
        run: yarn workspace @chardb/e2e e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Continuous deployment to staging.
  #
  # Adding `environment:` to either job below breaks the AWS login. GitHub then
  # mints the OIDC token with subject `repo:<repo>:environment:<name>` rather
  # than `repo:<repo>:ref:refs/heads/main`, and the deploy role's trust policy
  # matches that string exactly, so the job fails with "Not authorized to
  # perform sts:AssumeRoleWithWebIdentity". Teach allowed_subjects in
  # infra/modules/github-actions-deploy the environment form first.
  # ---------------------------------------------------------------------------
  deploy-backend:
    name: Deploy backend to staging
    needs: [lint, verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # The host is Graviton, so the image must be arm64. Building on x86 would
    # need QEMU emulation.
    runs-on: ubuntu-24.04-arm

    # Serialised: two concurrent `docker compose up` runs against one host.
    concurrency:
      group: deploy-staging-backend
      cancel-in-progress: false

    permissions:
      id-token: write # mint the OIDC token used to assume the deploy role
      contents: read

    env:
      AWS_REGION: us-east-1
      TF_ENVIRONMENT: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # terraform_wrapper wraps the binary in a script that captures output;
      # the deploy scripts parse `terraform output -json`, so it has to be off.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Initialise Terraform
        run: terraform -chdir=infra/environments/${{ env.TF_ENVIRONMENT }} init -input=false

      # Required by the ProxyCommand in scripts/lib/remote-host.sh.
      - name: Install Session Manager plugin
        run: |
          curl -fsSLo /tmp/session-manager-plugin.deb \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_arm64/session-manager-plugin.deb"
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version

      # The `v-` prefix is load-bearing: the ECR lifecycle policy only expires
      # images whose tag starts with "v".
      - name: Resolve image tag
        id: image
        run: echo "tag=v-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        run: ./scripts/build-and-push.sh "$TF_ENVIRONMENT" "${{ steps.image.outputs.tag }}"

      - name: Deploy to staging host
        run: ./deploy.sh "$TF_ENVIRONMENT" "${{ steps.image.outputs.tag }}"

      # deploy.sh returns once compose reports the containers up; the backend
      # still has migrations to run before it serves.
      - name: Verify backend health
        run: |
          source ./scripts/get-terraform-outputs.sh "$TF_ENVIRONMENT"
          echo "Polling http://$SERVER_IP:4000/health"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "http://$SERVER_IP:4000/health" > /dev/null; then
              echo "✅ Backend healthy after ${attempt} attempt(s)"
              exit 0
            fi
            echo "  attempt ${attempt}: not ready yet"
            sleep 10
          done
          echo "::error::Backend did not become healthy within 5 minutes"
          exit 1

  deploy-frontend:
    name: Deploy frontend to staging
    # After the backend, so a bundle never ships expecting a schema the deployed
    # API does not have.
    needs: deploy-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-staging-frontend
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-east-1
      TF_ENVIRONMENT: dev
      # @chardb/database's build runs prisma generate, which resolves
      # env("DATABASE_URL") without ever connecting.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            .yarn/install-state.gz
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: yarn install --immutable

      # The frontend imports these through their `types` field, which points at
      # gitignored dist/ directories.
      - name: Build workspace packages
        run: |
          yarn workspaces foreach -A --parallel \
            --include '@chardb/database' \
            --include '@chardb/shared' \
            --include '@chardb/ui' \
            run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Initialise Terraform
        run: terraform -chdir=infra/environments/${{ env.TF_ENVIRONMENT }} init -input=false

      # VITE_API_URL is baked in at build time, so the bundle has to be rebuilt
      # per environment rather than promoted between them.
      - name: Build and publish frontend
        run: |
          source ./scripts/get-terraform-outputs.sh "$TF_ENVIRONMENT"

          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Could not resolve BACKEND_URL from Terraform outputs"
            exit 1
          fi

          VERSION=$(node -p "require('./apps/frontend/package.json').version")
          ./scripts/build-frontend.sh "$TF_ENVIRONMENT" "$BACKEND_URL" "$VERSION"
          ./scripts/deploy-frontend.sh "$TF_ENVIRONMENT"
